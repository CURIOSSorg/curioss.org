# This site is served by GitHub Pages.
# This document is only for the PRs and branch deploys on Netlify.

[build]
  publish = "public"
  command = ".github/scripts/install-dart-sass.sh $HOME/dart-sass && PATH=$HOME/dart-sass:$PATH hugo --minify -b $URL"

[build.environment]
  HUGO_VERSION = "0.170.1"

[context.deploy-preview]
  command = ".github/scripts/install-dart-sass.sh $HOME/dart-sass && PATH=$HOME/dart-sass:$PATH hugo --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = ".github/scripts/install-dart-sass.sh $HOME/dart-sass && PATH=$HOME/dart-sass:$PATH hugo --minify -b $DEPLOY_PRIME_URL"