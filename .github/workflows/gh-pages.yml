name: github pages

on:
  push:
    branches: [main]
  # Rebuild daily so date-dependent pages (e.g. upcoming events and their RSS
  # feed) stay current without needing a push.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo

      - name: Build
        run: hugo --minify

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
