# CURIOSS member institutions, shown on /about/members/ in this order.
#
# The CURIOSS Academic Map (https://github.com/CURIOSSorg/academic-map) also reads
# this file when it builds: it shows each member's logo on the member's map page.
# The schema is data/schemas/members.schema.json.
#
# Fields:
#   name:    institution name, used as the logo's alt text
#   logo:    path to the logo under static/ (e.g. /images/about/logos/example.png)
#   url:     where the logo links to
#   mapPage: optional; the institution's page in the academic map, as a path
#            without .md (e.g. universities/example-university)

