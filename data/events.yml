# Upcoming events of interest to the CURIOSS community: meetups, workshops,
# summits, and calls for proposals. Rendered at /community/events/ and
# published as an RSS feed at /community/events/index.xml.
#
# To add an event, copy the template below to the end of the `events:` list and
# open a pull request. Order in this file does not matter; the page sorts by
# `start`. The data is validated against data/schemas/events.schema.json in CI.
#
# Fields:
#   title       (required) Name of the event.
#   posted      (required) Date the entry was added (YYYY-MM-DD). Used as the
#               RSS <pubDate>. Set it to the day you add the entry; do not change
#               it when editing an existing entry.
#   date        (required) Human-readable date, shown on the page and in the
#               feed. Can be fuzzy, e.g. "End of March 2027" or "April 2027",
#               and can include a time, e.g. "December 3, 2026, 10–11am PT".
#   start       (required) First day of the event (YYYY-MM-DD). Used to sort
#               events and to decide when an event is past. For fuzzy dates, use
#               a best guess and update it once the real date is announced.
#   end         (optional) Last day of a multi-day event (YYYY-MM-DD). An event
#               moves to "Past events" (and out of the RSS feed) the day after
#               `end`, or the day after `start` if there is no `end`.
#   location    (optional) City and/or format, e.g. "London", "Virtual (Zoom)",
#               "Berkeley, CA (hybrid)".
#   organizer   (optional) Who is running the event.
#   url         (optional) Event or registration page. If left out, the feed
#               links to the event's entry on the events page.
#   description (optional) Short description. Markdown is allowed.
#
# Changing an event's `title` changes its anchor on the page and its ID in the
# RSS feed, so subscribers will see it again as a new item. Fix typos freely,
# but avoid renaming events after they are posted.
#
# Template you can copy (remove the # comment marks at the beginning.)
#  - title:
#    posted:
#    date:
#    start:
#    end:
#    location:
#    organizer:
#    url:
#    description:

